<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A stylish Hello World page" />
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --violet: #a78bfa;
      --cyan: #67e8f9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(34, 211, 238, .20), transparent 28rem),
        radial-gradient(circle at 85% 80%, rgba(167, 139, 250, .23), transparent 30rem),
        #0b1020;
    }

    .orb {
      position: fixed;
      width: 19rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(1px);
      opacity: .42;
      animation: drift 11s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb-one { top: -6rem; right: 8%; background: #7c3aed; }
    .orb-two { bottom: -8rem; left: 6%; background: #0891b2; animation-delay: -4s; }

    main {
      position: relative;
      width: min(90%, 46rem);
      padding: clamp(2.5rem, 8vw, 5.5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 2rem;
      background: rgba(15, 23, 42, .62);
      box-shadow: 0 2rem 5rem rgba(0, 0, 0, .35);
      backdrop-filter: blur(18px);
      animation: appear .8s cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      display: inline-flex;
      gap: .5rem;
      align-items: center;
      margin: 0 0 1.25rem;
      color: var(--cyan);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .dot {
      width: .55rem;
      height: .55rem;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 1rem #4ade80;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.25rem);
      line-height: .95;
      letter-spacing: -.075em;
      background: linear-gradient(120deg, #fff 20%, var(--cyan) 50%, var(--violet) 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 34rem;
      margin: 1.5rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.7;
    }

    button {
      margin-top: 2.25rem;
      padding: .9rem 1.3rem;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      color: #07111f;
      background: linear-gradient(100deg, var(--cyan), #c4b5fd);
      box-shadow: 0 .7rem 2rem rgba(103, 232, 249, .22);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    button:hover { transform: translateY(-3px); box-shadow: 0 1rem 2.5rem rgba(167, 139, 250, .3); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    @keyframes appear { from { opacity: 0; transform: translateY(1.5rem) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate(3rem, 2rem) scale(1.13); } }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>

  <main>
    <p class="eyebrow"><span class="dot"></span> A bright new beginning</p>
    <h1>Hello, World!</h1>
    <p>Your first page is live — a small message with endless possibilities ahead.</p>
    <button type="button" id="greetButton">Say hello back ✨</button>
  </main>

  <script>
    const button = document.querySelector('#greetButton');
    button.addEventListener('click', () => {
      button.textContent = 'Hello to you too! 👋';
      button.setAttribute('aria-label', 'Hello to you too');
    });
  </script>
</body>
</html>
